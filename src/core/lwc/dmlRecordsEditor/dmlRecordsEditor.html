<template>
	<div class="editor-section">
		<lightning-radio-group
			class="slds-var-p-horizontal_xx-small slds-var-m-bottom_x-small"
			label="How Many Records to Insert"
			options={howManyOptions}
			type="radio"
			value={howMany}
			onchange={handleHowManyChange}
		></lightning-radio-group>
	</div>
	<div class="editor-section slds-border_top">
		<h3 class="slds-text-heading_small slds-var-m-bottom_small">{records.heading}</h3>
		<c-flow-resource-picker
			data-name={records.name}
			name={records.name}
			label={records.label}
			type="SObject"
			is-collection={isMultiple}
			required
			value={records.value}
			value-data-type={records.valueDataType}
			error-message={records.errorMessage}
			builder-context={builderContext}
			element-name={elementName}
			automatic-output-variables={automaticOutputVariables}
			onchange={handleRecordsChange}
		></c-flow-resource-picker>
		<p class="slds-text-body_regular slds-var-m-top_small">
			Make sure that ID is blank. After the records are inserted, find their IDs in the action's Record outputs.
		</p>
	</div>
	<template for:each={sections} for:item="section">
		<div key={section.heading} class="editor-section slds-border_top">
			<h3 class="slds-text-heading_small slds-var-m-bottom_small">{section.heading}</h3>
			<template for:each={section.fields} for:item="field">
				<c-flow-resource-picker
					key={field.name}
					class="slds-var-p-around_x-small slds-var-m-bottom_x-small slds-var-m-left_small"
					data-name={field.name}
					name={field.name}
					label={field.label}
					help-text={field.helpText}
					type={field.type}
					picklist-values={field.picklistValues}
					value={field.value}
					value-data-type={field.valueDataType}
					error-message={field.errorMessage}
					builder-context={builderContext}
					element-name={elementName}
					automatic-output-variables={automaticOutputVariables}
					onchange={handleInputChange}
				></c-flow-resource-picker>
			</template>
		</div>
	</template>
</template>

<template>
	<div class="field-row">
		<div class="field-type slds-text-color_weak">
			<span class="type-marker">{typeMarker}</span>
		</div>

		<div class="field-main">
			<div class="field-label-row">
				<template lwc:if={required}>
					<span class="required-indicator">*</span>
				</template>
				<span class="field-label slds-form-element__label">{label}</span>
				<template lwc:if={helpText}>
					<lightning-helptext content={helpText}></lightning-helptext>
				</template>
			</div>

			<template lwc:if={isIncluded}>
				<div class="control-row">
					<div class="control-cell">
						<div class={controlInputWrapClass}>
							<div
								class="resource-combobox"
								role="combobox"
								aria-expanded={showResourceDropdown}
								aria-haspopup="listbox"
							>
								<div class="resource-combobox-input-wrap">
									<lightning-input
										data-id="resource-input"
										class="field-control resource-combobox-input"
										type="text"
										name={name}
										label={label}
										variant="label-hidden"
										value={displayTextValue}
										placeholder={effectivePlaceholder}
										onfocus={handleTextFocus}
										oninput={handleTextInput}
										onblur={handleBlur}
										onchange={handleTextChange}
									></lightning-input>

									<div class="resource-trigger">
										<lightning-button-icon
											class="resource-trigger-button field-action"
											alternative-text="Search resources"
											icon-name={resourceTriggerIcon}
											size="small"
											variant="bare"
											onclick={handleResourceTriggerClick}
										></lightning-button-icon>
									</div>
								</div>

								<template lwc:if={showResourceDropdown}>
									<div class="resource-dropdown" role="listbox">
										<div class="resource-dropdown-header">{dropdownHeaderLabel}</div>

										<template lwc:if={hasVisibleOptions}>
											<template for:each={dropdownSections} for:item="section">
												<div key={section.key} class="resource-section">
													<div class="resource-section-title">{section.label}</div>

													<div class="resource-section-options">
														<template for:each={section.options} for:item="resourceOption">
															<button
																key={resourceOption.key}
																class="resource-option"
																type="button"
																data-key={resourceOption.key}
																onmousedown={handleResourceOptionMouseDown}
																onclick={handleResourceOptionClick}
															>
																<span class="resource-option-figure">
																	<lightning-icon
																		class="resource-option-icon"
																		icon-name={resourceOption.iconName}
																		size="xx-small"
																	></lightning-icon>
																</span>
																<span class="resource-option-label"
																	>{resourceOption.displayLabel}</span
																>
															</button>
														</template>
													</div>
												</div>
											</template>
										</template>

										<template lwc:else>
											<div class="resource-empty">No matching values or resources</div>
										</template>
									</div>
								</template>
							</div>
						</div>
					</div>
				</div>
			</template>

			<template lwc:if={showDefaultControl}>
				<div class="control-row">
					<div class="control-cell">
						<div class="control-input-wrap">
							<lightning-input
								class="field-control"
								type="text"
								name={name}
								label={label}
								variant="label-hidden"
								value={defaultDisplayValue}
								disabled
							></lightning-input>
						</div>
					</div>
				</div>
			</template>

			<template lwc:if={showEmptyState}>
				<div class="empty-state"></div>
			</template>

			<template lwc:if={errorMessage}>
				<div class="field-error slds-text-color_error slds-text-body_small">{errorMessage}</div>
			</template>
		</div>

		<template lwc:if={showIncludedToggle}>
			<div class="field-toggle">
				<lightning-input
					class="field-toggle-input"
					type="toggle"
					label={includedStateLabel}
					variant="label-hidden"
					checked={isIncluded}
					message-toggle-active=""
					message-toggle-inactive=""
					onchange={handleIncludedChange}
				></lightning-input>
				<span class="toggle-label">{includedStateLabel}</span>
			</div>
		</template>
	</div>
</template>

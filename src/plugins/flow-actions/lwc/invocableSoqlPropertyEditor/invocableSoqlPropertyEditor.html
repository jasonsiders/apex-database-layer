<template>
    <div class="slds-form slds-form_stacked">
        <div class="slds-form-element">
            <label class="slds-form-element__label" for="query-input">
                <abbr class="slds-required" title="required">*</abbr>
                Query
            </label>
            <div class="slds-form-element__control">
                <div class="code-editor-wrapper">
                    <pre class="code-highlight slds-m-around_none slds-scrollable_none" lwc:dom="manual" aria-hidden="true"></pre>
                    <textarea
                        id="query-input"
                        class="code-editor slds-m-around_none"
                        name="query"
                        autocapitalize="off"
                        autocomplete="off"
                        onchange={handleQueryChange}
                        oninput={handleQueryInput}
                        onscroll={handleEditorScroll}
                        spellcheck="false"
                    ></textarea>
                </div>
            </div>
        </div>

        <div class="slds-form-element slds-var-m-top_medium">
            <label class="slds-form-element__label">Bind Variables</label>
            <div class="slds-form-element__control">
                <div class="binds-list">
                    <template for:each={decoratedBinds} for:item="bind">
                        <c-flow-untyped-variable-input
                            key={bind.indexKey}
                            index={bind.indexKey}
                            variable={bind.variable}
                            resource-options={resourceOptions}
                            onchange={handleBindChange}
                            onremove={handleBindRemove}
                        ></c-flow-untyped-variable-input>
                    </template>
                </div>
                <div class="bind-actions">
                    <lightning-button
                        label="Add Bind Variable"
                        icon-name="utility:add"
                        onclick={handleBindAdd}
                    ></lightning-button>
                </div>
            </div>
        </div>
    </div>
</template>

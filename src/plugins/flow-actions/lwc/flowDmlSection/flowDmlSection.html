<template>
	<div class="section">
		<template lwc:if={isRequiredSection}>
			<div class="section-header section-header_required">
				<span class="section-label">{label}</span>
			</div>
		</template>
		<template lwc:else>
			<div class="section-header" onclick={handleToggle}>
				<lightning-icon icon-name={chevronIcon} size="x-small" class="chevron"></lightning-icon>
				<span class="section-label">{label}</span>
			</div>
		</template>
		<template lwc:if={isExpanded}>
			<div class="section-body">
				<slot></slot>
			</div>
		</template>
	</div>
</template>

<template>
    <div class="bind-row">
        <div class="bind-field">
            <lightning-input
                data-id="key"
                label="Bind Name"
                value={key}
                placeholder="e.g. recordId"
                onchange={handleKeyChange}
                required
            ></lightning-input>
        </div>
        <div class="bind-field">
            <c-flow-combobox
                data-id="value"
                included
                label="Value"
                name="textValue"
                onfieldchange={handleValueChange}
                required
                resource-options={resourceOptions}
                value={textValue}
            ></c-flow-combobox>
        </div>
        <div class="bind-field">
            <lightning-input
                data-id="type-name"
                label="Type"
                onchange={handleTypeNameChange}
                placeholder="e.g. String"
                required
                value={typeName}
            ></lightning-input>
        </div>
        <div class="bind-list-field">
            <span class="slds-form-element__label bind-field-label">List</span>
            <div class="bind-list-control">
                <lightning-input
                    checked={isCollection}
                    data-id="is-collection"
                    label="List"
                    onchange={handleIsCollectionChange}
                    type="checkbox"
                    variant="label-hidden"
                ></lightning-input>
            </div>
        </div>
        <div class="bind-remove-field">
            <span class="slds-form-element__label bind-field-label bind-field-label_placeholder" aria-hidden="true">&nbsp;</span>
            <div class="bind-remove-control">
                <lightning-button-icon
                    alternative-text="Remove"
                    icon-name="utility:delete"
                    onclick={handleRemove}
                    title="Remove"
                    variant="bare"
                ></lightning-button-icon>
            </div>
        </div>
    </div>
</template>

<template>
	<div class={fieldRowClass}>
		<div class="field-type">
			<lightning-icon class="type-marker-icon" icon-name={typeMarkerIconName} size="xx-small"></lightning-icon>
		</div>

		<template lwc:if={showLabel}>
			<div class="field-label-row">
				<template lwc:if={required}>
					<span class="required-indicator">*</span>
				</template>
				<span class="field-label slds-form-element__label">{label}</span>
				<template lwc:if={helpText}>
					<lightning-helptext content={helpText}></lightning-helptext>
				</template>
			</div>
		</template>

		<div class="field-main">
			<template lwc:if={showTypePicker}>
				<lightning-combobox
					data-id="type-picker"
					label="SObject Type"
					required
					value={typeValue}
					options={sobjectTypeOptions}
					onchange={handleTypeMappingChange}
				></lightning-combobox>
			</template>

			<template lwc:if={showVariablePicker}>
				<div class="control-row slds-form-element__control">
					<div class="control-cell">
						<template lwc:if={showSelectedResourcePill}>
							<div class="slds-pill_container">
								<lightning-pill
									class="selected-resource-pill"
									label={activeReferenceSelection.displayLabel}
									name={activeReferenceSelection.referenceName}
									onremove={handleSelectedResourceRemove}
								>
									<lightning-icon
										class="resource-option-icon"
										icon-name={activeReferenceSelection.iconName}
										size="x-small"
										alternative-text={activeReferenceSelection.displayLabel}
									></lightning-icon>
								</lightning-pill>
							</div>
						</template>

						<template lwc:else>
							<div class={controlInputWrapClass}>
								<div
									class={resourceComboboxClass}
									role="combobox"
									aria-expanded={showResourceDropdown}
									aria-haspopup="listbox"
								>
									<div
										class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right resource-combobox-input-wrap"
									>
										<lightning-input
											data-id="resource-input"
											class="field-control resource-combobox-input"
											type="text"
											name={name}
											label={label}
											variant="label-hidden"
											value={displayTextValue}
											placeholder={effectivePlaceholder}
											onfocus={handleTextFocus}
											oninput={handleTextInput}
											onblur={handleBlur}
											onchange={handleTextChange}
											onkeydown={handleInputKeyDown}
										></lightning-input>

										<div class="resource-trigger">
											<lightning-button-icon
												class="resource-trigger-button field-action"
												alternative-text="Search resources"
												icon-name={resourceTriggerIcon}
												size="medium"
												variant="bare"
												onclick={handleResourceTriggerClick}
											></lightning-button-icon>
										</div>
									</div>

									<template lwc:if={showResourceDropdown}>
										<div class="resource-dropdown slds-p-around_none" role="listbox">
											<div
												class="resource-dropdown-header slds-text-body_small"
												onmousedown={handleDropdownHeaderMouseDown}
												onclick={handleDropdownHeaderClick}
											>
												{dropdownHeaderLabel}
											</div>

											<template lwc:if={hasVisibleOptions}>
												<template for:each={dropdownSections} for:item="section">
													<div key={section.key} class="resource-section">
														<div class="resource-section-title slds-text-body_small">
															{section.label}
														</div>

														<ul
															class="resource-section-options slds-m-around_none"
															role="presentation"
														>
															<template
																for:each={section.options}
																for:item="resourceOption"
															>
																<li key={resourceOption.key} role="presentation">
																	<button
																		class="resource-option slds-size_full slds-text-color_default slds-text-align_left"
																		type="button"
																		role="option"
																		data-key={resourceOption.key}
																		aria-selected={resourceOption.isFocused}
																		onmousedown={handleResourceOptionMouseDown}
																		onclick={handleResourceOptionClick}
																	>
																		<span
																			class="resource-option-figure slds-grid_align-center"
																		>
																			<lightning-icon
																				class="resource-option-icon"
																				icon-name={resourceOption.iconName}
																				size="x-small"
																			></lightning-icon>
																		</span>
																		<span class="slds-media__body">
																			<span
																				class="slds-truncate"
																				title={resourceOption.displayLabel}
																				>{resourceOption.displayLabel}</span
																			>
																		</span>
																		<template lwc:if={resourceOption.isDrillable}>
																			<span
																				class="resource-option-chevron"
																				data-key={resourceOption.key}
																				onmousedown={handleResourceOptionChevronMouseDown}
																				onclick={handleResourceOptionChevronClick}
																			>
																				<lightning-icon
																					icon-name="utility:chevronright"
																					size="xx-small"
																				></lightning-icon>
																			</span>
																		</template>
																	</button>
																</li>
															</template>
														</ul>
													</div>
												</template>
											</template>

											<template lwc:else>
												<div class="resource-empty slds-var-p-around_small">
													No matching values or resources
												</div>
											</template>
										</div>
									</template>
								</div>
							</div>
						</template>
					</div>
				</div>
			</template>

			<template lwc:if={showDefaultControl}>
				<div class="control-row slds-form-element__control">
					<div class="control-cell">
						<div class="control-input-wrap">
							<lightning-input
								class="field-control"
								type="text"
								name={name}
								label={label}
								variant="label-hidden"
								value={defaultDisplayValue}
								disabled
							></lightning-input>
						</div>
					</div>
				</div>
			</template>

			<template lwc:if={showEmptyState}>
				<div class="empty-state slds-hide"></div>
			</template>

			<template lwc:if={effectiveErrorMessage}>
				<div class="field-error slds-form-element__help slds-text-color_error">{effectiveErrorMessage}</div>
			</template>
		</div>

		<template lwc:if={showIncludedToggle}>
			<div class="field-toggle slds-grid slds-grid_vertical">
				<lightning-input
					class="field-toggle-input"
					type="toggle"
					label={includedStateLabel}
					variant="label-hidden"
					checked={isIncluded}
					message-toggle-active=""
					message-toggle-inactive=""
					onchange={handleIncludedChange}
				></lightning-input>
				<span class="toggle-label slds-text-align_right">{includedStateLabel}</span>
			</div>
		</template>
	</div>
</template>

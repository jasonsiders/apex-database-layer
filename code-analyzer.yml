engines:
  # CPD rules can't be selectively disabled via @SuppressWarnings
  cpd:
    disable_engine: true
  # This isn't a js project, and eslint throws an error since no .eslint config file defined (in a /lwc directory)
  eslint:
    disable_engine: true
  # Flow rules require python; not going to require this, and no flows in this package:
  flow:
    disable_engine: true
  # Regex rules can't be selectively disabled via @SuppressWarnings
  regex:
    disable_engine: true

name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      promote-package:
        description: Promote New Package Versions?
        required: false
        default: true
        type: boolean
      unlocked-version:
        description: Unlocked Package Version (#.#.#)
        required: false
        type: string
      nebula-version:
        description: Nebula Plugin Package Version (#.#.#)
        required: false
        type: string

concurrency:
  # Queue releases to prevent version collisions - don't cancel, let them run sequentially
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core-changed: ${{ steps.check.outputs.core-changed }}
      nebula-changed: ${{ steps.check.outputs.nebula-changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Changed Paths
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^src/core/"; then
            echo "core-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "core-changed=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q "^src/plugins/nebula-logger/"; then
            echo "nebula-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nebula-changed=false" >> "$GITHUB_OUTPUT"
          fi

  versioning:
    name: Versioning
    needs: [detect-changes]
    outputs:
      unlocked-version: ${{ steps.determine-version.outputs.unlocked-version }}
      nebula-version: ${{ steps.determine-version.outputs.nebula-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine Versions
        id: determine-version
        env:
          CORE_CHANGED: ${{ needs.detect-changes.outputs.core-changed }}
          NEBULA_CHANGED: ${{ needs.detect-changes.outputs.nebula-changed }}
          INPUT_UNLOCKED_VERSION: ${{ inputs.unlocked-version }}
          INPUT_NEBULA_VERSION: ${{ inputs.nebula-version }}
        run: |
          strip_next() { echo "${1%.NEXT}"; }
          increment_patch() {
            IFS='.' read -ra P <<< "$1"
            echo "${P[0]}.${P[1]}.$((P[2] + 1))"
          }

          UNLOCKED_CURR=$(strip_next "$(jq -r '.packageDirectories[] | select(.default == true) | .versionNumber' sfdx-project.json)")
          NEBULA_CURR=$(strip_next "$(jq -r '.packageDirectories[] | select(.path == "src/plugins/nebula-logger") | .versionNumber' sfdx-project.json)")

          if [[ "${{ github.event_name }}" == "push" ]]; then
            UNLOCKED_PREV=$(strip_next "$(git show HEAD~1:sfdx-project.json | jq -r '.packageDirectories[] | select(.default == true) | .versionNumber')")
            NEBULA_PREV=$(strip_next "$(git show HEAD~1:sfdx-project.json | jq -r '.packageDirectories[] | select(.path == "src/plugins/nebula-logger") | .versionNumber')")

            if [[ "$UNLOCKED_CURR" == "$UNLOCKED_PREV" && "$CORE_CHANGED" == "true" ]]; then
              UNLOCKED_CURR=$(increment_patch "$UNLOCKED_CURR")
              echo "Auto-incremented unlocked version to: $UNLOCKED_CURR"
            fi
            if [[ "$NEBULA_CURR" == "$NEBULA_PREV" && "$NEBULA_CHANGED" == "true" ]]; then
              NEBULA_CURR=$(increment_patch "$NEBULA_CURR")
              echo "Auto-incremented nebula version to: $NEBULA_CURR"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ -n "$INPUT_UNLOCKED_VERSION" ]] && UNLOCKED_CURR="$INPUT_UNLOCKED_VERSION"
            [[ -n "$INPUT_NEBULA_VERSION" ]] && NEBULA_CURR="$INPUT_NEBULA_VERSION"
          fi

          echo "Unlocked version: $UNLOCKED_CURR"
          echo "Nebula version: $NEBULA_CURR"

          if [[ ! "$UNLOCKED_CURR" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Unlocked version '$UNLOCKED_CURR' is not valid semver"
            exit 1
          fi
          if [[ ! "$NEBULA_CURR" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Nebula version '$NEBULA_CURR' is not valid semver"
            exit 1
          fi

          echo "unlocked-version=$UNLOCKED_CURR" >> "$GITHUB_OUTPUT"
          echo "nebula-version=$NEBULA_CURR" >> "$GITHUB_OUTPUT"

  create-package-versions:
    name: Create Package Versions
    needs: [versioning, detect-changes]
    permissions:
      contents: write
    uses: ./.github/workflows/packaging.yml
    secrets: inherit
    with:
      run-unlocked-package: ${{ needs.detect-changes.outputs.core-changed == 'true' || github.event_name == 'workflow_dispatch' }}
      run-nebula-plugin-package: ${{ needs.detect-changes.outputs.nebula-changed == 'true' || github.event_name == 'workflow_dispatch' }}
      promote-package: ${{ inputs.promote-package || false }}
      unlocked-version: ${{ needs.versioning.outputs.unlocked-version }}
      nebula-version: ${{ needs.versioning.outputs.nebula-version }}

  create-unlocked-release:
    name: Create Unlocked Release
    needs: [versioning, detect-changes, create-package-versions]
    if: ${{ success() && (needs.detect-changes.outputs.core-changed == 'true' || github.event_name == 'workflow_dispatch') && needs.create-package-versions.outputs.unlocked-version-id != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          body: |
            ## Installation

            ### Unlocked Package
            **Package Version**: `${{ needs.create-package-versions.outputs.unlocked-version-id }}`
            ```bash
            sf package install --package ${{ needs.create-package-versions.outputs.unlocked-version-id }} --wait 20
            ```
          generate_release_notes: true
          make_latest: true
          tag_name: unlocked/v${{ needs.versioning.outputs.unlocked-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

  create-nebula-release:
    name: Create Nebula Plugin Release
    needs: [versioning, detect-changes, create-package-versions]
    if: ${{ success() && (needs.detect-changes.outputs.nebula-changed == 'true' || github.event_name == 'workflow_dispatch') && needs.create-package-versions.outputs.nebula-version-id != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          body: |
            ## Installation

            ### Nebula Logger Plugin
            **Package Version**: `${{ needs.create-package-versions.outputs.nebula-version-id }}`
            ```bash
            sf package install --package ${{ needs.create-package-versions.outputs.nebula-version-id }} --wait 20
            ```
          generate_release_notes: true
          make_latest: false
          tag_name: plugin-nebula/v${{ needs.versioning.outputs.nebula-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

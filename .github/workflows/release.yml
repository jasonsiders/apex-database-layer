name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      promote:
        description: Promote New Package Versions?
        required: false
        default: true
        type: boolean
      create-release:
        description: Create GitHub Releases?
        required: false
        default: true
        type: boolean
      skip-validation:
        description: Skip validation and code coverage checks
        required: false
        default: false
        type: boolean

concurrency:
  # Queue releases to prevent version collisions - don't cancel, let them run sequentially
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.check.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Package Directories
        id: check
        shell: bash
        run: |
          PACKAGES='[]'

          while IFS= read -r entry; do
            PKG_ALIAS=$(echo "$entry" | jq -r '.package')
            PKG_PATH=$(echo "$entry" | jq -r '.path')

            # Include package if: workflow_dispatch (run all), or files changed under its path
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
               git diff --name-only HEAD~1 HEAD | grep -q "^${PKG_PATH}/"; then

              PACKAGES=$(echo "$PACKAGES" | jq \
                --arg pkg "$PKG_ALIAS" \
                '. + [{"package": $pkg}]')
              echo "Detected changes in $PKG_ALIAS"
            fi
          done < <(jq -c '.packageDirectories[] | select(.package != null)' sfdx-project.json)

          echo "Changed packages: $PACKAGES"
          {
            echo 'packages<<EOF'
            echo "$PACKAGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  create-package-versions:
    name: Create Package Version
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.packages != '[]' && needs.detect-changes.outputs.packages != '' }}
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false
    permissions:
      contents: write
    uses: ./.github/workflows/packaging.yml
    secrets: inherit
    with:
      package: ${{ matrix.pkg.package }}
      promote: ${{ inputs.promote || false }}
      create-release: ${{ inputs.create-release == true || github.event_name == 'push' }}
      skip-validation: ${{ inputs.skip-validation || false }}

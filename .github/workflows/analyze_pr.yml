name: Analyze PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "force-app/**"
    types: [opened, reopened, synchronize]

concurrency:
  # Cancel old runs when a new commit is pushed to the same branch
  group: analyze-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CHANGES_DIR: changes

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    name: Run Static Analysis
    if: ${{ '! github.event.pull_request.draft' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup SF CLI
        uses: ./.github/actions/setup-sf-cli
        with:
          install-plugins: "true"

      - name: Get Changed Files
        run: |
          # Ensure this check only runs against changed files in the current PR; not the entire codebase
          set -euo pipefail
          mkdir "$CHANGES_DIR"
          sf sgd source delta --generate-delta --from "HEAD^" --to "HEAD" --output-dir "$CHANGES_DIR"/ --source-dir "force-app/"
          echo "Changed files:"
          ls "$CHANGES_DIR"

      - name: Run Salesforce Code Analyzer
        id: scan
        uses: forcedotcom/run-code-analyzer@v2
        with:
          github-token: ${{ github.token }}
          results-artifact-name: salesforce-code-analyzer-results
          run-arguments: "--target ${{ env.CHANGES_DIR }} --view detail --output-file sfca_results.json"

      - name: Handle Errors
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/report-error
        with:
          actor: ${{ github.actor }}
          run-id: ${{ github.run_id }}
          token: ${{ github.token }}

      - name: Evaluate
        if: |
          steps.scan.outputs.exit-code > 0 ||
          steps.scan.outputs.num-sev1-violations > 0 ||
          steps.scan.outputs.num-sev2-violations > 0
        run: |
          echo "🚨 sf code-analyzer detected violations that exceed the acceptable threshold."
          exit 1

  run-unit-tests:
    name: Run Unit Tests
    if: ${{ '! github.event.pull_request.draft' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SF CLI
        uses: ./.github/actions/setup-sf-cli

      - name: Auth Devhub
        env:
          CLIENT_ID: ${{ secrets.SALESFORCE_CONSUMER_KEY }}
          JWT_KEY: ${{ secrets.SALESFORCE_JWT_KEY }}
          USERNAME: ${{ secrets.SALESFORCE_DEVHUB_USERNAME }}
        run: |
          set -euo pipefail
          echo "${JWT_KEY}" > server.key
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --set-default-dev-hub \
            --username "$USERNAME"
          trap 'rm -f server.key' EXIT

      - name: Create Scratch Org
        id: create-scratch-org
        run: |
          set -euo pipefail
          RESPONSE=$(sf org create scratch \
            --duration-days 1 \
            --json \
            --set-default \
            --wait 10)
          USERNAME=$(echo "$RESPONSE" | jq -r '.result.username')
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Run Tests
        run: sf apex run test --code-coverage --result-format human --synchronous

      - name: Delete Scratch Org
        if: ${{ always() && steps.create-scratch-org.outputs.username != '' }}
        env:
          SCRATCH_ORG: ${{ steps.create-scratch-org.outputs.username }}
        run: sf org delete scratch --no-prompt --target-org "$SCRATCH_ORG"

      - name: Handle Errors
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/report-error
        with:
          actor: ${{ github.actor }}
          run-id: ${{ github.run_id }}
          token: ${{ github.token }}

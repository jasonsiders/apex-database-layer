name: Packaging

on:
  workflow_call:
    inputs:
      package:
        description: Package alias (from sfdx-project.json)
        required: true
        type: string
      version:
        description: Version number (#.#.#). If omitted, uses value from sfdx-project.json
        required: false
        type: string
      promote:
        description: Promote new package version?
        default: false
        required: false
        type: boolean
      create-release:
        description: Create a GitHub release?
        default: false
        required: false
        type: boolean
      skip-validation:
        description: Skip validation and code coverage checks
        default: false
        required: false
        type: boolean
    outputs:
      version-id:
        description: "Package Version ID"
        value: ${{ jobs.create-package-version.outputs.version-id }}
      version-name:
        description: "Package Version Name"
        value: ${{ jobs.create-package-version.outputs.version-name }}
  workflow_dispatch:
    inputs:
      package:
        description: Package alias (from sfdx-project.json)
        required: true
        type: string
      version:
        description: Version number (#.#.#). If omitted, uses value from sfdx-project.json
        required: false
        type: string
      promote:
        description: Promote new package version?
        default: false
        required: false
        type: boolean
      create-release:
        description: Create a GitHub release?
        default: false
        required: false
        type: boolean
      skip-validation:
        description: Skip validation and code coverage checks
        default: false
        required: false
        type: boolean

jobs:
  create-package-version:
    name: Create Package Version (${{ inputs.package }})
    outputs:
      version-id: ${{ steps.create-package.outputs.version-id }}
      version-name: ${{ steps.get-version.outputs.version-name }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Setup NPM
        shell: bash
        run: npm ci

      - name: Setup SF CLI
        uses: ./.github/actions/setup-sf-cli

      - name: Authenticate Devhub
        env:
          CLIENT_ID: ${{ secrets.SALESFORCE_CONSUMER_KEY }}
          JWT_KEY: ${{ secrets.SALESFORCE_JWT_KEY }}
          USERNAME: ${{ secrets.SALESFORCE_DEVHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${JWT_KEY}" > server.key
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --set-default-dev-hub \
            --username "$USERNAME"
          trap 'rm -f server.key' EXIT

      - name: Get Version Number
        id: get-version
        env:
          PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION_NUMBER="${INPUT_VERSION}.NEXT"
            echo "Using specified version number: $VERSION_NUMBER"
          else
            SF_RESULT=$(sf package version list --packages "$PACKAGE" --json 2>&1 || true)
            LATEST=$(echo "$SF_RESULT" | \
              jq -r '[(.result // [])[] | select(.CreatedStatus == "Success")] | sort_by(.MajorVersion, .MinorVersion, .PatchVersion, .BuildNumber) | last')
            if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
              VERSION_NUMBER=$(jq -r --arg pkg "$PACKAGE" \
                '.packageDirectories[] | select(.package == $pkg) | .versionNumber' \
                sfdx-project.json)
              echo "No existing versions found; using sfdx-project.json: $VERSION_NUMBER"
            else
              MAJOR=$(echo "$LATEST" | jq -r '.MajorVersion')
              MINOR=$(echo "$LATEST" | jq -r '.MinorVersion')
              PATCH=$(echo "$LATEST" | jq -r '.PatchVersion')
              IS_RELEASED=$(echo "$LATEST" | jq -r '.IsReleased')
              if [[ "$IS_RELEASED" == "true" ]]; then
                PATCH=$((PATCH + 1))
              fi
              VERSION_NUMBER="${MAJOR}.${MINOR}.${PATCH}.NEXT"
              echo "Computed version from Salesforce: $VERSION_NUMBER (IsReleased=${IS_RELEASED})"
            fi
          fi
          VERSION_NAME="v${VERSION_NUMBER%.NEXT}"
          echo "version-number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Update Package Version
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION_NUMBER: ${{ steps.get-version.outputs.version-number }}
          VERSION_NAME: ${{ steps.get-version.outputs.version-name }}
        run: |
          jq --arg pkg "$PACKAGE" --arg vn "$VERSION_NUMBER" --arg vnm "$VERSION_NAME" \
            '(.packageDirectories[] | select(.package == $pkg) | .versionNumber) = $vn |
             (.packageDirectories[] | select(.package == $pkg) | .versionName) = $vnm' \
            sfdx-project.json > sfdx-project.json.tmp && mv sfdx-project.json.tmp sfdx-project.json

      - name: Create New Package Version
        id: create-package
        env:
          PACKAGE: ${{ inputs.package }}
          WIKI_URL: "https://github.com/jasonsiders/apex-database-layer/wiki"
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_FLAG=$([[ "${{ inputs.skip-validation }}" == "true" ]] && echo "skip-validation" || echo "code-coverage")
          COMMAND="sf package version create --$VALIDATION_FLAG --installation-key-bypass --json --package \"$PACKAGE\" --post-install-url \"$WIKI_URL\" --wait 29"
          echo "$COMMAND"
          if RESULT=$(eval "$COMMAND" 2>&1); then
            VERSION_ID=$(echo "$RESULT" | jq -r '.result.SubscriberPackageVersionId')
            echo "Package Version ID: $VERSION_ID"
            echo "version-id=$VERSION_ID" >> "$GITHUB_OUTPUT"
            [[ -n "$VERSION_ID" && "$VERSION_ID" != "null" ]] || { echo "ERROR: Invalid version ID"; exit 1; }
          else
            echo "::error::Package creation failed: $RESULT"
            exit 1
          fi

      - name: Promote Package Version
        if: ${{ inputs.promote == true }}
        env:
          VERSION_ID: ${{ steps.create-package.outputs.version-id }}
          VERSION_NAME: ${{ steps.get-version.outputs.version-name }}
          PACKAGE: ${{ inputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          sf package version promote --package "$VERSION_ID" --no-prompt
          echo "Promoted $PACKAGE $VERSION_NAME - $VERSION_ID"

      - name: Run Prettier
        shell: bash
        run: npx prettier -w sfdx-project.json

      - name: Pull Latest Changes
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main || {
            echo "Rebase failed, trying merge strategy"
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase origin main
          }

      - name: Tag & Commit Changes
        uses: "stefanzweifel/git-auto-commit-action@v6"
        with:
          commit_message: "Packaged ${{ inputs.package }} version ${{ steps.get-version.outputs.version-name }}"
          skip_dirty_check: true

      - name: Compute Release Metadata
        id: release-meta
        if: ${{ inputs.create-release == true }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION_NAME: ${{ steps.get-version.outputs.version-name }}
        shell: bash
        run: |
          TAG_PREFIX=$(echo "$PACKAGE" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          echo "tag=${TAG_PREFIX}/${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          IS_DEFAULT=$(jq -r --arg pkg "$PACKAGE" \
            '.packageDirectories[] | select(.package == $pkg) | .default // false' \
            sfdx-project.json)
          echo "make-latest=$IS_DEFAULT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ inputs.create-release == true }}
        uses: softprops/action-gh-release@v2.3.2
        with:
          body: |
            ## Installation

            **Package Version**: `${{ steps.create-package.outputs.version-id }}`
            ```bash
            sf package install --package ${{ steps.create-package.outputs.version-id }} --wait 20
            ```
          generate_release_notes: true
          make_latest: ${{ steps.release-meta.outputs.make-latest }}
          tag_name: ${{ steps.release-meta.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

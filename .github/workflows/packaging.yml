name: Packaging

on:
  workflow_call:
    inputs:
      run-unlocked-package:
        description: Create Unlocked Package Version?
        default: true
        required: false
        type: boolean
      run-nebula-plugin-package:
        description: Create Nebula Plugin Package Version?
        default: true
        required: false
        type: boolean
      promote-package:
        description: Promote New Package Version?
        default: false
        required: false
        type: boolean
      skip-validation:
        description: Skip validation and code coverage checks
        default: false
        required: false
        type: boolean
      unlocked-version:
        description: Unlocked Package Version Number (#.#.#)
        required: false
        type: string
      nebula-version:
        description: Nebula Plugin Package Version Number (#.#.#)
        required: false
        type: string
    outputs:
      unlocked-version-id:
        description: "Unlocked Package Version ID"
        value: ${{ jobs.create-unlocked-package-version.outputs.version-id }}
      nebula-version-id:
        description: "Nebula Plugin Package Version ID"
        value: ${{ jobs.create-nebula-plugin-package-version.outputs.version-id }}
  workflow_dispatch:
    inputs:
      run-unlocked-package:
        description: Create Unlocked Package Version?
        default: true
        required: false
        type: boolean
      run-nebula-plugin-package:
        description: Create Nebula Plugin Package Version?
        default: true
        required: false
        type: boolean
      promote-package:
        description: Promote New Package Version?
        default: false
        required: false
        type: boolean
      skip-validation:
        description: Skip validation and code coverage checks
        default: false
        required: false
        type: boolean
      unlocked-version:
        description: Unlocked Package Version Number (#.#.#)
        required: false
        type: string
      nebula-version:
        description: Nebula Plugin Package Version Number (#.#.#)
        required: false
        type: string

jobs:
  create-unlocked-package-version:
    name: Create Unlocked Package Version
    if: ${{ inputs.run-unlocked-package }}
    outputs:
      version-id: ${{ steps.create-package.outputs.version-id }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Setup NPM
        shell: bash
        run: npm ci

      - name: Setup SF CLI
        uses: ./.github/actions/setup-sf-cli

      - name: Authenticate Devhub
        env:
          CLIENT_ID: ${{ secrets.SALESFORCE_CONSUMER_KEY }}
          JWT_KEY: ${{ secrets.SALESFORCE_JWT_KEY }}
          USERNAME: ${{ secrets.SALESFORCE_DEVHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${JWT_KEY}" > server.key
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --set-default-dev-hub \
            --username "$USERNAME"
          trap 'rm -f server.key' EXIT

      - name: Get Version Number
        id: get-version
        env:
          INPUT_VERSION: ${{ inputs.unlocked-version }}
        shell: bash
        run: |
          if [[ -z "$INPUT_VERSION" ]]; then
            VERSION_NUMBER=$(jq -r '.packageDirectories[] | select(.default == true) | .versionNumber' sfdx-project.json)
            echo "Using the version number defined in sfdx-project.json: $VERSION_NUMBER"
          else
            VERSION_NUMBER="${INPUT_VERSION}.NEXT"
            echo "Using specified version number: $VERSION_NUMBER"
          fi
          VERSION_NAME="v${VERSION_NUMBER%.NEXT}"
          echo "version-number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Update Package Version
        shell: bash
        env:
          VERSION_NUMBER: ${{ steps.get-version.outputs.version-number }}
          VERSION_NAME: ${{ steps.get-version.outputs.version-name }}
        run: |
          jq --arg vn "$VERSION_NUMBER" --arg vnm "$VERSION_NAME" \
            '(.packageDirectories[] | select(.default == true) | .versionNumber) = $vn |
             (.packageDirectories[] | select(.default == true) | .versionName) = $vnm' \
            sfdx-project.json > sfdx-project.json.tmp && mv sfdx-project.json.tmp sfdx-project.json

      - name: Create New Package Version
        id: create-package
        env:
          VERSION_NUMBER: ${{ steps.get-version.outputs.version-number }}
          WIKI_URL: "https://github.com/jasonsiders/apex-database-layer/wiki"
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ALIAS=$(jq -r '.packageDirectories[] | select(.default == true) | .package' sfdx-project.json)
          VALIDATION_FLAG=$([[ "${{ inputs.skip-validation }}" == "true" ]] && echo "skip-validation" || echo "code-coverage")
          COMMAND="sf package version create --$VALIDATION_FLAG --installation-key-bypass --json --package \"$PACKAGE_ALIAS\" --post-install-url \"$WIKI_URL\" --wait 29"
          echo "$COMMAND"
          if RESULT=$(eval "$COMMAND" 2>&1); then
            VERSION_ID=$(echo "$RESULT" | jq -r '.result.SubscriberPackageVersionId')
            echo "Package Version ID: $VERSION_ID"
            echo "version-id=$VERSION_ID" >> "$GITHUB_OUTPUT"
            [[ -n "$VERSION_ID" && "$VERSION_ID" != "null" ]] || { echo "ERROR: Invalid version ID"; exit 1; }
          else
            echo "::error::Package creation failed: $RESULT"
            exit 1
          fi

      - name: Promote Package Version
        if: ${{ inputs.promote-package == 'true' }}
        env:
          VERSION_ID: ${{ steps.create-package.outputs.version-id }}
          VERSION_NAME: ${{ steps.get-version.outputs.version-name }}
        shell: bash
        run: |
          set -euo pipefail
          sf package version promote --package "$VERSION_ID" --no-prompt
          echo "::success:: Promoted unlocked package $VERSION_NAME - $VERSION_ID"

      - name: Run Prettier
        shell: bash
        run: npx prettier -w sfdx-project.json

      - name: Pull Latest Changes
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main || {
            echo "Rebase failed, trying merge strategy"
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase origin main
          }

      - name: Tag & Commit Changes
        uses: "stefanzweifel/git-auto-commit-action@v6"
        with:
          commit_message: "Packaged new unlocked version ${{ steps.get-version.outputs.version-name }}"
          skip_dirty_check: true

  create-nebula-plugin-package-version:
    name: Create Nebula Plugin Package Version
    if: ${{ inputs.run-nebula-plugin-package }}
    outputs:
      version-id: ${{ steps.create-package.outputs.version-id }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Setup NPM
        shell: bash
        run: npm ci

      - name: Setup SF CLI
        uses: ./.github/actions/setup-sf-cli

      - name: Authenticate Devhub
        env:
          CLIENT_ID: ${{ secrets.SALESFORCE_CONSUMER_KEY }}
          JWT_KEY: ${{ secrets.SALESFORCE_JWT_KEY }}
          USERNAME: ${{ secrets.SALESFORCE_DEVHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${JWT_KEY}" > server.key
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --set-default-dev-hub \
            --username "$USERNAME"
          trap 'rm -f server.key' EXIT

      - name: Get Version Number
        id: get-version
        env:
          INPUT_VERSION: ${{ inputs.nebula-version }}
        shell: bash
        run: |
          if [[ -z "$INPUT_VERSION" ]]; then
            VERSION_NUMBER=$(jq -r '.packageDirectories[] | select(.path == "src/plugins/nebula-logger") | .versionNumber' sfdx-project.json)
            echo "Using the version number defined in sfdx-project.json: $VERSION_NUMBER"
          else
            VERSION_NUMBER="${INPUT_VERSION}.NEXT"
            echo "Using specified version number: $VERSION_NUMBER"
          fi
          VERSION_NAME="v${VERSION_NUMBER%.NEXT}"
          echo "version-number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Update Package Version
        shell: bash
        env:
          VERSION_NUMBER: ${{ steps.get-version.outputs.version-number }}
          VERSION_NAME: ${{ steps.get-version.outputs.version-name }}
        run: |
          jq --arg vn "$VERSION_NUMBER" --arg vnm "$VERSION_NAME" \
            '(.packageDirectories[] | select(.path == "src/plugins/nebula-logger") | .versionNumber) = $vn |
             (.packageDirectories[] | select(.path == "src/plugins/nebula-logger") | .versionName) = $vnm' \
            sfdx-project.json > sfdx-project.json.tmp && mv sfdx-project.json.tmp sfdx-project.json

      - name: Create New Package Version
        id: create-package
        env:
          VERSION_NUMBER: ${{ steps.get-version.outputs.version-number }}
          WIKI_URL: "https://github.com/jasonsiders/apex-database-layer/wiki"
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ALIAS=$(jq -r '.packageDirectories[] | select(.path == "src/plugins/nebula-logger") | .package' sfdx-project.json)
          VALIDATION_FLAG=$([[ "${{ inputs.skip-validation }}" == "true" ]] && echo "skip-validation" || echo "code-coverage")
          COMMAND="sf package version create --$VALIDATION_FLAG --installation-key-bypass --json --package \"$PACKAGE_ALIAS\" --post-install-url \"$WIKI_URL\" --wait 29"
          echo "$COMMAND"
          if RESULT=$(eval "$COMMAND" 2>&1); then
            VERSION_ID=$(echo "$RESULT" | jq -r '.result.SubscriberPackageVersionId')
            echo "Package Version ID: $VERSION_ID"
            echo "version-id=$VERSION_ID" >> "$GITHUB_OUTPUT"
            [[ -n "$VERSION_ID" && "$VERSION_ID" != "null" ]] || { echo "ERROR: Invalid version ID"; exit 1; }
          else
            echo "::error::Package creation failed: $RESULT"
            exit 1
          fi

      - name: Promote Package Version
        if: ${{ inputs.promote-package == 'true' }}
        env:
          VERSION_ID: ${{ steps.create-package.outputs.version-id }}
          VERSION_NAME: ${{ steps.get-version.outputs.version-name }}
        shell: bash
        run: |
          set -euo pipefail
          sf package version promote --package "$VERSION_ID" --no-prompt
          echo "::success:: Promoted nebula-logger plugin $VERSION_NAME - $VERSION_ID"

      - name: Run Prettier
        shell: bash
        run: npx prettier -w sfdx-project.json

      - name: Pull Latest Changes
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main || {
            echo "Rebase failed, trying merge strategy"
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase origin main
          }

      - name: Tag & Commit Changes
        uses: "stefanzweifel/git-auto-commit-action@v6"
        with:
          commit_message: "Packaged nebula-logger plugin version ${{ steps.get-version.outputs.version-name }}"
          skip_dirty_check: true
